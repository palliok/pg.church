services:

  app:
    image: pgchurch-app
    restart: unless-stopped
    build: &php-build
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www
    depends_on:
      database:
        condition: service_healthy

  # Планировщик Laravel: синхронизация внешних календарей каждые 15 минут (routes/console.php).
  scheduler:
    image: pgchurch-app
    build: *php-build
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8300}:80"
    volumes:
      - ./backend:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgchurch
      POSTGRES_USER: pgchurch
      # На сервере пароль задаётся в .env рядом с docker-compose.yml (тот же, что DB_PASSWORD в backend/.env).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5437}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgchurch -d pgchurch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:

# MTU сети контейнеров должен совпадать с MTU сервера (на облачных серверах часто 1450),
# иначе большие загрузки (composer, календари) зависают. Задаётся в .env: DOCKER_MTU=1450.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}
